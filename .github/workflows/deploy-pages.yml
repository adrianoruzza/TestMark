name: Build e Deploy TestMark su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installa dipendenze
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verifica tipi TypeScript
        run: npm run lint

      - name: Build produzione per /TestMark/
        env:
          VITE_BASE_PATH: /TestMark/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Verifica assenza credenziali, segreti o source map nel codice e nella build
        run: |
          if [ -f firebase-applet-config.json ]; then
            echo "ERRORE SICUREZZA: file firebase-applet-config.json presente nel repository!"
            exit 1
          fi
          if find dist -name '*.map' | grep -q .; then
            echo "ERRORE SICUREZZA: rilevate source map (.map) nella build di produzione!"
            exit 1
          fi
          MATCHED=$(grep -rlE 'AIza[0-9A-Za-z_-]{35}|GOCSPX-[0-9A-Za-z_-]+|ya29\.[0-9A-Za-z_-]+|1//[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(ghp_|github_pat_)[0-9A-Za-z_]+|AKIA[0-9A-Z]{16}' src public dist .env.example index.html README.md 2>/dev/null || true)
          if [ -n "$MATCHED" ]; then
            echo "ERRORE SICUREZZA: Rilevata credenziale o segreto nei seguenti file:"
            echo "$MATCHED"
            exit 1
          fi

      - name: Verifica integrità artefatti build e PWA
        run: |
          test -f dist/index.html || (echo "ERRORE: dist/index.html mancante" && exit 1)
          test -f dist/404.html || (echo "ERRORE: dist/404.html mancante" && exit 1)
          test -f dist/.nojekyll || (echo "ERRORE: dist/.nojekyll mancante" && exit 1)
          test -f dist/manifest.webmanifest || (echo "ERRORE: dist/manifest.webmanifest mancante" && exit 1)
          test -f dist/sw.js || (echo "ERRORE: dist/sw.js mancante" && exit 1)
          test -f dist/favicon.ico || (echo "ERRORE: dist/favicon.ico mancante" && exit 1)
          test -f dist/testmark-favicon-32-v3.png || (echo "ERRORE: dist/testmark-favicon-32-v3.png mancante" && exit 1)
          test -f dist/testmark-icon-192-v3.png || (echo "ERRORE: dist/testmark-icon-192-v3.png mancante" && exit 1)
          test -f dist/testmark-icon-512-v3.png || (echo "ERRORE: dist/testmark-icon-512-v3.png mancante" && exit 1)
          test -f dist/testmark-icon-maskable-512-v3.png || (echo "ERRORE: dist/testmark-icon-maskable-512-v3.png mancante" && exit 1)
          test -f dist/testmark-apple-touch-icon-v3.png || (echo "ERRORE: dist/testmark-apple-touch-icon-v3.png mancante" && exit 1)
          grep -q '/TestMark/assets/' dist/index.html || (echo "ERRORE: base path /TestMark/ non presente in dist/index.html" && exit 1)
          grep -q '/TestMark/manifest.webmanifest' dist/index.html || (echo "ERRORE: manifest.webmanifest non collegato in dist/index.html" && exit 1)
          grep -q '/TestMark/testmark-icon-192-v3.png' dist/index.html || (echo "ERRORE: nuova icona non collegata in dist/index.html" && exit 1)

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
