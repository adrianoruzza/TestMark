name: Build e Deploy TestMark su GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verifica tipi TypeScript
        run: npm run lint

      - name: Build produzione per /TestMark/
        env:
          VITE_BASE_PATH: /TestMark/
        run: npm run build

      - name: Verifica integrità artefatti build e PWA
        run: |
          test -f dist/index.html || (echo "ERRORE: dist/index.html mancante" && exit 1)
          test -f dist/404.html || (echo "ERRORE: dist/404.html mancante" && exit 1)
          test -f dist/.nojekyll || (echo "ERRORE: dist/.nojekyll mancante" && exit 1)
          test -f dist/manifest.webmanifest || (echo "ERRORE: dist/manifest.webmanifest mancante" && exit 1)
          test -f dist/sw.js || (echo "ERRORE: dist/sw.js mancante" && exit 1)
          test -f dist/pwa-192x192.png || (echo "ERRORE: dist/pwa-192x192.png mancante" && exit 1)
          test -f dist/pwa-512x512.png || (echo "ERRORE: dist/pwa-512x512.png mancante" && exit 1)
          test -f dist/pwa-maskable-512x512.png || (echo "ERRORE: dist/pwa-maskable-512x512.png mancante" && exit 1)
          test -f dist/apple-touch-icon.png || (echo "ERRORE: dist/apple-touch-icon.png mancante" && exit 1)
          grep -q '/TestMark/assets/' dist/index.html || (echo "ERRORE: base path /TestMark/ non presente in dist/index.html" && exit 1)
          grep -q '/TestMark/manifest.webmanifest' dist/index.html || (echo "ERRORE: manifest.webmanifest non collegato in dist/index.html" && exit 1)

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
